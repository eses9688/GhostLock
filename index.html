<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GhostOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/style.css" />
</head>
<body>
  <!-- 부팅 화면 -->
  <div id="boot"></div>

  <!-- GhostOS 데스크톱 (부팅 후 표시) -->
  <div id="ghostos" hidden>
    <header id="os-topbar"></header>
    <main id="os-desktop"></main>
    <footer id="os-taskbar"></footer>

    <!-- 창이 열리는 레이어 -->
    <div id="os-windows" hidden></div>

    <!-- Story 시스템 이벤트 오버레이 (화면 전체 장악) -->
    <div id="story-overlay" hidden></div>

    <!-- 데스크톱 알림 레이어 -->
    <div id="os-notifications"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
